# Based on https://github.com/baronfel/multi-rid-tool/blob/main/.github/workflows/build-aot-packages.yml

name: Build AOT Tool Packages

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  resolve-package-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package_version.outputs.version }}

    steps:
    - name: Determine package version
      id: package_version
      shell: pwsh
      run: |
        if ("${{ github.ref }}".StartsWith("refs/tags/")) {
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }
        } else {
          $version = "0.0.0-ci.${{ github.run_number }}"
        }
        if ([string]::IsNullOrWhiteSpace($version)) {
          throw "Could not determine package version from git ref name."
        }
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build-platform-specific:
    needs: resolve-package-version
    strategy:
      fail-fast: false
      matrix:
        # the rid isn't required to _make_ the packages (we use --use-current-runtime), 
        # but it helps name the artifacts clearly and allows us to use the same workflow for all platforms.
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-2025
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-15
            rid: osx-x64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4

    - name: Build AOT package for ${{ matrix.rid }}
      run: dotnet pack src/Watcher.cs --use-current-runtime -p:Version=${{ needs.resolve-package-version.outputs.version }}

    - name: Upload platform-specific package
      uses: actions/upload-artifact@v4
      with:
        name: aot-package-${{ matrix.rid }}
        path: src/artifacts/Watcher/*.nupkg
        retention-days: 30
        if-no-files-found: error

  build-agnostic:
    needs: resolve-package-version
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4

    - name: Build agnostic AOT package
      run: dotnet pack src/Watcher.cs -p:Version=${{ needs.resolve-package-version.outputs.version }}

    - name: Upload agnostic package
      uses: actions/upload-artifact@v4
      with:
        name: aot-package-agnostic
        path: src/artifacts/Watcher/*.nupkg
        retention-days: 30
        if-no-files-found: error

  collect-all-packages:
    needs: [build-platform-specific, build-agnostic]
    runs-on: ubuntu-latest

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: collected-packages

    - name: Merge nupkg files
      run: |
        mkdir -p merged-packages
        find collected-packages -type f -name "*.nupkg" -exec cp -f {} merged-packages/ \;

    - name: List all merged packages
      run: |
        echo "All merged AOT packages:"
        find merged-packages -name "*.nupkg" -type f | sort
        echo ""
        echo "Package count: $(find merged-packages -name "*.nupkg" -type f | wc -l)"

    - name: Upload all packages as single artifact
      uses: actions/upload-artifact@v4
      with:
        name: all-aot-packages
        path: merged-packages/*.nupkg
        retention-days: 90
        if-no-files-found: error

  publish-to-nuget:
    needs: collect-all-packages
    # if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # enable GitHub OIDC token issuance for this job

    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4

    - name: Download all-aot-packages artifact
      uses: actions/download-artifact@v4
      with:
        name: all-aot-packages
        path: artifacts/package/release

    - name: List downloaded packages
      run: find artifacts/package/release -type f -name "*.nupkg" | sort

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USERNAME }}

    - name: push to NuGet
      shell: pwsh
      run: |
        Get-ChildItem artifacts/package/release -Filter *.nupkg | ForEach-Object {
          Write-Host "Pushing package: $($_.FullName)"
          # dotnet nuget push $_.FullName `
          #   --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
          #   --source https://api.nuget.org/v3/index.json `
          #   --skip-duplicate
        }
