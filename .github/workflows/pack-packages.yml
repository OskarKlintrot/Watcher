# Based on https://github.com/baronfel/multi-rid-tool/blob/main/.github/workflows/build-aot-packages.yml

name: Build AOT Tool Packages

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-platform-specific:
    strategy:
      fail-fast: false
      matrix:
        # the rid isn't required to _make_ the packages (we use --use-current-runtime), 
        # but it helps name the artifacts clearly and allows us to use the same workflow for all platforms.
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-2025
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-15
            rid: osx-x64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4

    - name: Build AOT package for ${{ matrix.rid }}
      run: dotnet pack src/Watcher.cs --use-current-runtime

    - name: Upload platform-specific package
      uses: actions/upload-artifact@v4
      with:
        name: aot-package-${{ matrix.rid }}
        path: src/artifacts/Watcher/*.nupkg
        retention-days: 30
        if-no-files-found: error

  build-agnostic:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4

    - name: Build agnostic AOT package
      run: dotnet pack src/Watcher.cs

    - name: Upload agnostic package
      uses: actions/upload-artifact@v4
      with:
        name: aot-package-agnostic
        path: src/artifacts/Watcher/*.nupkg
        retention-days: 30
        if-no-files-found: error

  collect-all-packages:
    needs: [build-platform-specific, build-agnostic]
    runs-on: ubuntu-latest

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: collected-packages

    - name: Extract and merge nupkg files
      run: |
        mkdir -p merged-packages extracted-artifacts

        # Extract downloaded zip artifacts and collect nupkg files from them.
        i=0
        while IFS= read -r zip_file; do
          i=$((i + 1))
          target_dir="extracted-artifacts/$i"
          mkdir -p "$target_dir"
          unzip -q "$zip_file" -d "$target_dir"
        done < <(find collected-packages -type f -name "*.zip")

        find extracted-artifacts -type f -name "*.nupkg" -exec cp -f {} merged-packages/ \;

    - name: List all merged packages
      run: |
        echo "All merged AOT packages:"
        find merged-packages -name "*.nupkg" -type f | sort
        echo ""
        echo "Package count: $(find merged-packages -name "*.nupkg" -type f | wc -l)"

    - name: Upload all packages as single artifact
      uses: actions/upload-artifact@v4
      with:
        name: all-aot-packages
        path: merged-packages/*.nupkg
        retention-days: 90
        if-no-files-found: error